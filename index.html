<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="微仰">
    <meta name="theme-color" content="#0a0a0a">
    <title>微仰</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gesture-blinds.css">
</head>
<body>
    <div id="splash">
        <svg class="brand-line" viewBox="0 0 320 160" width="240" height="120">
            <defs>
                <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#4a4c52"/>
                    <stop offset="55%" stop-color="#c9cbd1"/>
                    <stop offset="100%" stop-color="#ffffff"/>
                </linearGradient>
                <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            <path id="riseLine" d="M 30 120 C 110 112, 200 96, 270 46"
                  fill="none" stroke="url(#lineGrad)" stroke-width="4"
                  stroke-linecap="round" filter="url(#softGlow)"/>
            <circle id="riseDot" cx="270" cy="46" r="7" fill="#ffffff" filter="url(#softGlow)"/>
        </svg>
        <div class="brand-name" id="brand-name">微仰</div>
        <div class="tagline" id="tagline">把视线，往上抬一点</div>
    </div>

    <div id="main">
        <div class="home-entries">
            <button class="home-entry" id="quests-entry">
                <span class="home-entry-title">主线</span>
                <span class="home-entry-sub">有一件事，你真的想完成</span>
            </button>
            <button class="home-entry home-entry-side" id="side-entry">
                <span class="home-entry-title">支线</span>
                <span class="home-entry-sub">今天，也可以做一点别的</span>
            </button>
        </div>
        <div class="home-links">
            <button class="history-link" id="history-link">记录</button>
            <button class="history-link" id="settings-link">设置</button>
        </div>
    </div>

    <div id="side-quest">
        <div class="sq-content">
            <div class="sq-content-inner">
                <div class="sq-title">支线世界</div>
                <div class="sq-sub" id="sq-sub">今天，也可以做一点别的</div>
                <div class="sq-card" id="sq-card">
                    <div class="sq-cat" id="sq-cat"></div>
                    <div class="sq-task" id="sq-task"></div>
                    <div id="sq-details" class="sq-details" style="display:none">
                        <div class="sq-details-title">具体步骤</div>
                        <ol class="sq-details-list" id="sq-details-list"></ol>
                    </div>
                    <div class="sq-actions">
                        <button class="sq-btn secondary" id="sq-refresh">换一个</button>
                        <button class="sq-btn primary" id="sq-do">去做</button>
                        <button class="sq-btn secondary" id="sq-skip" style="display:none">我没做</button>
                        <button class="sq-btn primary" id="sq-confirm" style="display:none">做完了</button>
                    </div>
                </div>
                <button class="sq-back" id="sq-back">回到主线</button>
            </div>
        </div>
    </div>

    <div id="quests-page">
        <div class="history-header">
            <button id="quests-back" class="history-back">‹ 微仰</button>
            <span class="history-title">我的主线</span>
            <span class="history-placeholder"></span>
        </div>
        <div class="quests-list" id="quests-list"></div>
        <button class="add-quest-btn" id="add-quest-btn">+ 添加一条主线</button>
    </div>

    <div id="quest-picker-page">
        <div class="history-header">
            <button id="picker-back" class="history-back">‹ 返回</button>
            <span class="history-title">选择主线</span>
            <span class="history-placeholder"></span>
        </div>
        <div class="picker-intro">可以同时拥有多条主线，选 1～3 条最合适的</div>
        <div class="picker-groups" id="picker-groups"></div>
    </div>

    <div id="settings-page">
        <div class="history-header">
            <button id="settings-back" class="history-back">‹ 微仰</button>
            <span class="history-title">设置</span>
            <span class="history-placeholder"></span>
        </div>
        <div class="settings-group">
            <div class="settings-group-title">早晚提醒</div>
            <p class="settings-note">网页版提醒只在你打开页面时生效；真正的后台推送需要 Web Push 服务器，后续版本实现。</p>
            <label class="settings-row">
                <span>早上提醒</span>
                <input type="checkbox" id="morning-enabled" class="settings-switch">
            </label>
            <label class="settings-row">
                <span>晚上复盘提醒</span>
                <input type="checkbox" id="evening-enabled" class="settings-switch">
            </label>
        </div>
        <div class="settings-group">
            <div class="settings-group-title">关于微仰</div>
            <p class="settings-note">把视线，往上抬一点。</p>
        </div>
    </div>

    <div id="evening-nudge">
        <div class="nudge-content">
            <div class="nudge-text" id="nudge-text">今天快结束了<br>要不要看看今天留下了什么？</div>
            <div class="nudge-actions">
                <button class="nudge-btn secondary" id="nudge-dismiss">明天再说</button>
                <button class="nudge-btn primary" id="nudge-open">去看看</button>
            </div>
        </div>
    </div>

    <div id="blind">
        <div id="blind-glow"></div>
    </div>

    <div class="bind-hint">上滑 进入支线</div>

    <div id="card-container">
        <div class="card">
            <div class="card-category" id="card-category"></div>
            <div class="card-content" id="card-content"></div>
            <div id="card-details" style="display:none">
                <div class="card-details-title">具体步骤</div>
                <ol class="card-details-list" id="card-details-list"></ol>
            </div>
            <div class="card-actions">
                <button class="card-btn secondary" id="detail-btn">详情</button>
                <button class="card-btn secondary" id="refresh-btn">换一个</button>
                <button class="card-btn primary" id="done-btn">去做</button>
                <button class="card-btn secondary" id="skip-btn" style="display:none">我没做</button>
                <button class="card-btn primary" id="confirm-done-btn" style="display:none">做完了</button>
            </div>
        </div>
    </div>

    <div id="detail-panel">
        <div class="detail-content">
            <div class="detail-header">
                <span>具体步骤</span>
                <button id="close-detail">关闭</button>
            </div>
            <ul id="detail-list"></ul>
        </div>
    </div>

    <div id="complete-feedback">
        <div class="feedback-content">
            <div class="feedback-icon">
                <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
            </div>
            <div class="feedback-text" id="feedback-text">你今天往上抬了一点点<br>这很棒</div>
        </div>
    </div>

    <div id="history-page">
        <div class="history-header">
            <button id="history-home-back" class="history-back">‹ 微仰</button>
            <span class="history-title">记录</span>
            <span class="history-placeholder"></span>
        </div>
        <div class="week-header">
            <button id="prev-week" class="week-nav">‹</button>
            <span class="week-range" id="week-range"></span>
            <button id="next-week" class="week-nav">›</button>
        </div>
        <div class="week-grid" id="week-grid"></div>
        <div class="week-hint">点一天，看看那天的记录</div>
    </div>

    <div id="history-day-page">
        <div class="history-header">
            <button id="day-back" class="history-back">‹ 记录</button>
            <span class="day-date" id="day-date"></span>
            <span class="history-placeholder"></span>
        </div>
        <div class="day-summary" id="day-summary"></div>
        <div class="day-records" id="day-records"></div>
    </div>

    <script src="data.js"></script>
    <script src="quests-data.js"></script>
    <script src="app.js"></script>
    <script src="gesture-blinds.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
