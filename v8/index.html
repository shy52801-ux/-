<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="微仰">
    <meta name="theme-color" content="#0a0a0a">
    <title>微仰</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash">
        <div class="line-container">
            <div class="horizon-line"></div>
            <div class="tilt-line" id="tilt-line"></div>
        </div>
        <div class="brand-name" id="brand-name">微仰</div>
        <div class="tagline" id="tagline">把视线，往上抬一点</div>
    </div>

    <div id="main">
        <button class="main-button" id="main-btn">
            <svg viewBox="0 0 100 40">
                <line x1="5" y1="30" x2="95" y2="15" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </button>
    </div>

    <div id="card-container">
        <div class="card">
            <div class="card-category" id="card-category"></div>
            <div class="card-content" id="card-content"></div>
            <div class="card-actions">
                <button class="card-btn secondary" id="detail-btn">详情</button>
                <button class="card-btn secondary" id="refresh-btn">换一个</button>
                <button class="card-btn primary" id="done-btn">去做</button>
            </div>
        </div>
    </div>

    <div id="detail-panel">
        <div class="detail-content">
            <div class="detail-header">
                <span>具体步骤</span>
                <button id="close-detail">关闭</button>
            </div>
            <ul id="detail-list"></ul>
        </div>
    </div>

    <div id="complete-feedback">
        <div class="feedback-content">
            <div class="feedback-icon">
                <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
            </div>
            <div class="feedback-text" id="feedback-text">你今天往上抬了一点点<br>这很棒</div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
